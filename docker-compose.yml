version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: tkhq-ff-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - OPERATOR_AGENT_PROTOCOL=grpc
    restart: unless-stopped
    networks:
      - tkhq-ff

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: tkhq-ff-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - tkhq-ff

networks:
  tkhq-ff:
    driver: bridge
