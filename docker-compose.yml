version: '3.9'

services:
  tkhq-ff:
    image: ghcr.io/justinformentin/tkhq-ff:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - OPERATOR_AGENT_GRPC_HOST=${OPERATOR_AGENT_GRPC_HOST:-localhost}
      - OPERATOR_AGENT_GRPC_PORT=${OPERATOR_AGENT_GRPC_PORT:-4452}
      - DEFAULT_ENVIRONMENT=${DEFAULT_ENVIRONMENT:-dev}
      - PORT=3001
    restart: unless-stopped
