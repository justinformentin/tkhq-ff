message FeatureFlagInfo {
  string flag = 1;
  bool enabled = 2;
  int32 rollout_percent = 3;
  repeated OrgRule allowed_orgs = 4;
  repeated OrgRule disallowed_orgs = 5;
  repeated ProductRule allowed_products = 6;
  repeated ProductRule disallowed_products = 7;
}

message OrgRule {
  string org_id = 1;
  bool enabled = 2;
}

message ProductRule {
  int32 product_type = 1;
  int32 product_sub_type = 2;
  bool enabled = 3;
}

message ListFeatureFlagsRequest {}

message ListFeatureFlagsResponse {
  repeated FeatureFlagInfo flags = 1;
}

message GetFeatureFlagRequest {
  string flag = 1;
}

message GetFeatureFlagResponse {
  FeatureFlagInfo flag = 1;
}

message SetFeatureFlagRequest {
  string flag = 1;
  bool enabled = 2;
  int32 rollout_percent = 3;
}

message SetFeatureFlagResponse {
  FeatureFlagInfo flag = 1;
}

message AddFeatureFlagOrgRequest {
  string flag = 1;
  string org_id = 2;
  bool enabled = 3;
}

message AddFeatureFlagOrgResponse {
  FeatureFlagInfo flag = 1;
}

message RemoveFeatureFlagOrgRequest {
  string flag = 1;
  string org_id = 2;
}

message RemoveFeatureFlagOrgResponse {
  FeatureFlagInfo flag = 1;
}

message AddFeatureFlagProductRequest {
  string flag = 1;
  int32 product_type = 2;
  int32 product_sub_type = 3;
  bool enabled = 4;
}

message AddFeatureFlagProductResponse {
  FeatureFlagInfo flag = 1;
}

message RemoveFeatureFlagProductRequest {
  string flag = 1;
  int32 product_type = 2;
  int32 product_sub_type = 3;
}

message RemoveFeatureFlagProductResponse {
  FeatureFlagInfo flag = 1;
}
