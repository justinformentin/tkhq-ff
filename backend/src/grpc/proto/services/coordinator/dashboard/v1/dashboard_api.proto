  string client_data_json = 2 [(google.api.field_behavior) = REQUIRED];

  // https://www.w3.org/TR/webauthn-2/#authenticator-data
  // Sample authenticatorData blob: pvqb5kSxaXGGfGF_ud-tqXBtqYvQkakFq1Va0AJ0flgFAAAAAA
