}

message PaymasterFleetSyncSummary {
  string caip2 = 1;
  uint32 current_total = 2;
  uint32 current_enabled = 3;
  uint32 target_enabled = 4;
  uint32 create_count = 5;
  uint32 register_count = 6;
  uint32 awaiting_funding_count = 7;
  reserved 8;
  reserved "enable_count";
  uint32 disable_count = 9;
  bool funding_config_needs_update = 10;
  repeated string post_sync_destination_addresses = 11;
  optional string policy_hot_wallet_address = 12;
  uint32 current_deployer_total = 13;
  uint32 target_deployer_count = 14;
  uint32 deployer_create_count = 15;
  uint32 deployer_register_count = 16;
  uint32 deployer_awaiting_funding_count = 17;
  uint32 deployer_disable_count = 18;
}

message PaymasterFleetSyncCandidate {
  string caip2 = 1;
  uint32 derivation_index = 2;
  string path = 3;
  optional string wallet_account_id = 4;
  optional string address = 5;
  optional string paymaster_id = 6;
  optional string status = 7;
}

message PaymasterFleetSyncAction {
  enum ActionType {
    ACTION_TYPE_UNSPECIFIED = 0;
    ACTION_TYPE_CREATE_WALLET_ACCOUNTS = 1;
    ACTION_TYPE_REGISTER_PAYMASTERS = 2;
    reserved 3;
    reserved "ACTION_TYPE_ENABLE_PAYMASTERS";
    ACTION_TYPE_DISABLE_PAYMASTERS = 4;
    ACTION_TYPE_UPSERT_FUNDING_CONFIG = 5;
    ACTION_TYPE_MARK_PAYMASTERS_AWAITING_FUNDING = 6;
    ACTION_TYPE_CREATE_PAYMASTER_WALLET_ACCOUNTS = 7;
    ACTION_TYPE_CREATE_HOT_WALLET_ACCOUNTS = 8;
    ACTION_TYPE_FORCE_ENABLE_PAYMASTERS = 9;
  }

  ActionType action_type = 1;
  string caip2 = 2;
  uint32 count = 3;
  repeated PaymasterFleetSyncCandidate candidates = 4;
  string description = 5;
  bool deployer = 6;
}

message PaymasterFleetSyncChainResult {
  string caip2 = 1;
  repeated PaymasterFleetSyncCandidate created = 2;
  repeated PaymasterFleetSyncCandidate registered = 3;
  repeated PaymasterFleetSyncCandidate marked_awaiting_funding = 4;
  reserved 5;
  reserved "enabled";
  repeated PaymasterFleetSyncCandidate disabled = 6;
  bool funding_config_updated = 7;
  repeated string warnings = 8;
  repeated string errors = 9;
  repeated PaymasterFleetSyncCandidate force_enabled = 10;
}

message PaymasterFleetSyncManualPolicyTemplate {
  string caip2 = 1;
  string title = 2;
  string effect = 3;
  string consensus = 4;
  string condition = 5;
  string source_address = 6;
  repeated string destination_addresses = 7;
  bool template_may_be_incomplete_until_apply = 8;
  uint32 pending_paymaster_creates = 9;
}

message PreviewPaymasterFleetSyncResponse {
  repeated PaymasterFleetSyncSummary summaries = 1;
  repeated PaymasterFleetSyncAction actions = 2;
  repeated string warnings = 3;
  repeated PaymasterFleetSyncManualPolicyTemplate manual_policy_templates = 4;
}

message ReconcilePaymasterFleetSyncResponse {
  PaymasterFleetSyncSpec spec = 1;
  repeated string warnings = 2;
}

message ApplyPaymasterFleetSyncResponse {
  repeated PaymasterFleetSyncSummary summaries = 1;
  repeated PaymasterFleetSyncAction actions = 2;
  repeated PaymasterFleetSyncChainResult results = 3;
  repeated string warnings = 4;
  repeated PaymasterFleetSyncManualPolicyTemplate manual_policy_templates = 5;
}

