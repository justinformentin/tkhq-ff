  // Optional end date filter (RFC-3339). Only include addresses added before this date.
  optional google.protobuf.Timestamp end_date = 2;

  // Optional page size
  optional int32 page_size = 3;

  // Optional pagination token returned from previous call
  optional string next_token = 4;

  // Optional list of reasons to filter by
  repeated SuppressionListReason reasons = 5;
}

// Response for listing suppressed emails
