// GetRateLimitRequest describes a request to retrieve the rate limit for an
// organization.
message GetRateLimitRequest {
  // OrgId specifies the organization ID whose rate limit should be set.
  string org_id = 1;
}

// GetRateLimitResponse describes the rate limit for the given organization.
message GetRateLimitResponse {
  // OrgId specifies the organization ID whose rate limit was retrieved.
  string org_id = 1;

  // BillingOrgId specifies the billing org ID
  string billing_org_id = 2;

  // ProductType is a string representation of the org's product type
  immutable.common.v1.ProductType product_type = 3;

  // RateLimits is a list of all applicable rate limits
  repeated RateLimit rate_limits = 4;

  optional immutable.common.v1.ProductSubType product_sub_type = 5;
}

message RateLimit {
  enum RateLimitCategory {
    RATE_LIMIT_CATEGORY_UNSPECIFIED = 0;

    // These are deprecated and won't be emitted by operator console
    RATE_LIMIT_CATEGORY_DEFAULT_DB = 1;
    RATE_LIMIT_CATEGORY_DEFAULT_HARDCODED = 2;
    RATE_LIMIT_CATEGORY_ORG = 3;
    RATE_LIMIT_CATEGORY_PARENT_ORG = 4;
    RATE_LIMIT_CATEGORY_INHERITED = 5;

    RATE_LIMIT_CATEGORY_DEFAULT_HARD_CODED = 6;
    RATE_LIMIT_CATEGORY_DEFAULT_FAMILY = 7;
    RATE_LIMIT_CATEGORY_DEFAULT_INHERITED = 8;
    RATE_LIMIT_CATEGORY_CUSTOM_ORG = 9;
    RATE_LIMIT_CATEGORY_CUSTOM_FAMILY = 10;
    RATE_LIMIT_CATEGORY_CUSTOM_INHERITED = 11;
  }

  RateLimitCategory category = 1;

  // RequestsPerMinute sets the number of requests per second to allow from the
  // associated Organization.
  uint32 requests_per_minute = 2;

  // Rule defines the rate limit rule which should be matched.
  RateLimitRuleType rule = 3;

  // RuleVariant varies the rule
  optional string rule_variant = 4;

  // Remediation determines behavior if limit is exceeded
  RateLimitRemediation remediation = 5;

  optional google.protobuf.Timestamp expires_at = 6;

  RateLimitBucketType bucket_type = 7;

  uint32 id = 8;

  immutable.common.v1.ProductType product_type = 9;

  string notes = 10;

  optional immutable.common.v1.ProductSubType product_sub_type = 11;
}

message GetInterdictionsRequest {
  // OrgID is the organization ID for which interdictions of which should be
  // returned.
  string org_id = 1;
}

message GetInterdictionsResponse {
  // InterdictionKeys is the list of interdictions applicable to the requested org,
  // including their keys and any assigned owners
  repeated Interdiction interdictions = 1;
}

message Interdiction {
  string key = 1;
  repeated string owners = 2;
}

message OrgRefsRequest {
  // OrgId specifies the organization ID whose references should be retrieved.
  string org_id = 1;
}

message OrgRefsResponse {
  // OrgID is the ID of the organization which was requested.
  string org_id = 1;

  // BillingOrgID is the ID of the organization which is responsible for billing
  // of the requested organization.
  string billing_org_id = 2;

  // CustomerID is the ID of the customer which owns the requested organization
  // (if any).
  string customer_id = 3;

  // ProductType is the billing product to which the organization is a member.
  immutable.common.v1.ProductType product_type = 4;

  // IsCached indicated whether the org ref data is currently present in the Redis orgCache
  bool is_cached = 5;

  // ProductSubType is the product sub-type of the org, if applicable
  optional immutable.common.v1.ProductSubType product_sub_type = 6;
}

message CreateSesDomainRequest {
  string domain = 1;

  // Optional custom configuration set name; defaults to derived from domain if omitted.
  optional string configuration_set_name = 2;

  // Optional custom tenant name; defaults to domain if omitted.
  optional string tenant_name = 3;

  // Optional custom MailFromDomain. Ex: mail -> mail.example.com
  optional string mail_from_domain = 4;
}

message CreateSesDomainResponse {
  string identity_name = 1;
  string configuration_set_name = 2;
  repeated string tenant_names = 3;
  string mail_from_domain = 4;

  // DNS records to be published for SES verification (TXT / CNAME / MX). This includes DKIM, DMARC and Mail-From records.
  repeated DnsRecord dns_records = 5;

  // Overall SES verification status (PENDING, SUCCESS, FAILED, etc.)
  VerificationStatus verification_status = 6;

  // Whether SES considers the domain verified for sending
  bool verified_for_sending = 7;

  // Individual verification status for DKIM
  VerificationStatus dkim_status = 8;

  // Individual verification status for Mail-From domain
  VerificationStatus mail_from_domain_status = 9;
}

message GetSesDomainRequest {
  string domain = 1;
}

message GetSesDomainResponse {
  string identity_name = 1;
  string configuration_set_name = 2;
  repeated string tenant_names = 3;
  string mail_from_domain = 4;

  // DNS records to be published for SES verification (TXT / CNAME / MX). This includes DKIM, DMARC and Mail-From records.
  repeated DnsRecord dns_records = 5;

  // Overall SES verification status (PENDING, SUCCESS, FAILED, etc.)
  VerificationStatus verification_status = 6;

  // Whether SES considers the domain verified for sending
  bool verified_for_sending = 7;

  // Individual verification status for DKIM
  VerificationStatus dkim_status = 8;

  // Individual verification status for Mail-From domain
  VerificationStatus mail_from_domain_status = 9;
}

message RefreshSesDomainRequest {
  string domain = 1;
}

message RefreshSesDomainResponse {
  string identity_name = 1;
  string configuration_set_name = 2;
  repeated string tenant_names = 3;
  string mail_from_domain = 4;

  // DNS records to be published for SES verification (TXT / CNAME / MX). This includes DKIM, DMARC and Mail-From records.
  repeated DnsRecord dns_records = 5;

  // Overall SES verification status (PENDING, SUCCESS, FAILED, etc.)
  VerificationStatus verification_status = 6;

  // Whether SES considers the domain verified for sending
  bool verified_for_sending = 7;

  // Individual verification status for DKIM
  VerificationStatus dkim_status = 8;

  // Individual verification status for Mail-From domain
  VerificationStatus mail_from_domain_status = 9;
}

// Mirrors SES verification status values
enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_PENDING = 1;
  VERIFICATION_STATUS_SUCCESS = 2;
  VERIFICATION_STATUS_FAILED = 3;
  VERIFICATION_STATUS_TEMPORARY_FAILURE = 4;
  VERIFICATION_STATUS_NOT_STARTED = 5;
}

// Represents a DNS record to be published for SES (TXT / CNAME / MX)
message DnsRecord {
  string type = 1;
  string name = 2;
  string value = 3;
  string note = 4;
}

