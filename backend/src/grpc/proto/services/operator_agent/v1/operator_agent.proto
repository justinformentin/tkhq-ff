message PaymasterFleetSyncFundingPolicy {
  string hot_wallet_address = 1;
  string paymaster_full_balance = 2;
  double paymaster_low_watermark_pct = 3;
  string paymaster_topup_batch_size = 4;
  string hot_wallet_full_balance = 5;
  double hot_wallet_low_watermark_pct = 6;
  optional string hot_wallet_wallet_account_id = 7;
  // Deployer-specific funding targets. When unset, deployer addresses fall back to the paymaster_* values above.
  // These also don't need to be set if deployer_count=0 in the PaymasterFleetSyncChain spec.
  optional string deployer_full_balance = 8;
  optional double deployer_low_watermark_pct = 9;
  optional string deployer_topup_batch_size = 10;
}

message PaymasterFleetSyncChain {
  string caip2 = 1;
  uint32 enabled_count = 2;
  optional PaymasterFleetSyncFundingPolicy funding_policy = 3;
  // Number of deployer addresses (purpose=deploy) to maintain on this chain. 0 = none.
  uint32 deployer_count = 4;
}

message PaymasterFleetSyncSpec {
  reserved 1, 2;
  reserved "environment", "turnkey_org_id";
  string paymaster_wallet_id = 3;
  repeated PaymasterFleetSyncChain chains = 4;
}

message PreviewPaymasterFleetSyncRequest {
  PaymasterFleetSyncSpec spec = 1;
  bool force_enable = 2;
}

message ReconcilePaymasterFleetSyncRequest {
  PaymasterFleetSyncSpec spec = 1;
}

message ApplyPaymasterFleetSyncRequest {
  PaymasterFleetSyncSpec spec = 1;
